workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master"'
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "devops" || $CI_COMMIT_BRANCH == "master")'
    - when: never

stages:
  - test
  - promote

variables:
  IMAGE_SHA: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  GITOPS_REPO: "https://github.com/Rasiulknots/ecomms-gitops.git"
  GITOPS_BRANCH: "devops"
  GITOPS_MANIFEST: "apps/auth/service/deployment.yaml"

build_test:
  stage: test
  tags:
    - dell-local
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master"'
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "devops" || $CI_COMMIT_BRANCH == "master")'
  script:
    - docker info
    - echo "Building Auth Service image $IMAGE_SHA"
    - docker build -t "$IMAGE_SHA" .
    - echo "Testing Laravel application startup"
    - docker run --rm "$IMAGE_SHA" php artisan --version
    - |
      if [ "$CI_PIPELINE_SOURCE" = "push" ] && [ "$CI_COMMIT_BRANCH" = "master" ]; then
        echo "$CI_JOB_TOKEN" | docker login "$CI_REGISTRY" -u gitlab-ci-token --password-stdin
        docker push "$IMAGE_SHA"
        docker logout "$CI_REGISTRY"
        echo "Published production image: $IMAGE_SHA"
      else
        echo "Test passed. No image was published."
      fi
  after_script:
    - docker logout "$CI_REGISTRY" 2>/dev/null || true

promote_gitops:
  stage: promote
  tags:
    - dell-local
  needs:
    - build_test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master"'
  script:
    - test -n "$GITOPS_GITHUB_TOKEN" || (echo "GITOPS_GITHUB_TOKEN is missing" && exit 1)
    - git config --global user.name "GitLab CI"
    - git config --global user.email "gitlab-ci@users.noreply.github.com"
    - git clone --branch "$GITOPS_BRANCH" "https://x-access-token:${GITOPS_GITHUB_TOKEN}@github.com/Rasiulknots/ecomms-gitops.git" gitops
    - cd gitops
    - |
      sed -i -E "s|(registry.gitlab.com/ecomms1/ecomms-authservice:)[^[:space:]]+|\1${CI_COMMIT_SHORT_SHA}|g" "$GITOPS_MANIFEST"
    - echo "=== Image references after update ==="
    - grep -n 'registry.gitlab.com/ecomms1/ecomms-authservice:' "$GITOPS_MANIFEST"
    - git add "$GITOPS_MANIFEST"
    - |
      if git diff --cached --quiet; then
        echo "GitOps manifest already references this image."
      else
        git commit -m "Deploy Auth Service ${CI_COMMIT_SHORT_SHA}"
        git push origin "$GITOPS_BRANCH"
      fi
